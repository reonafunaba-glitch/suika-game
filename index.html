<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミニスイカゲーム</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f8f3df;
}

canvas{
    background:#fff;
    border:4px solid #333;
}
</style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const fruits = [
    { r:20, emoji:"🍒", color:"#ff6b6b" },
    { r:30, emoji:"🍓", color:"#ff8787" },
    { r:40, emoji:"🍊", color:"#ffa94d" },
    { r:55, emoji:"🍋", color:"#ffd43b" },
    { r:70, emoji:"🍎", color:"#69db7c" },
    { r:90, emoji:"🍐", color:"#38d9a9" },
    { r:115, emoji:"🍈", color:"#4dabf7" },
    { r:145, emoji:"🍍", color:"#9775fa" },
    { r:180, emoji:"🍉", color:"#cc5de8" }
];

let score = 0;
let mouseX = 200;
let nextFruit = Math.floor(Math.random() * 5);

let gameOver = false;
let canDrop = true;

let effectTimer = 0;
let effectText = "";

const gameOverLine = 140;
const items = [];

canvas.addEventListener("mousemove",(e)=>{
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
});

canvas.addEventListener("click",()=>{

    if(gameOver) return;
    if(!canDrop) return;

    canDrop = false;

    setTimeout(()=>{
        canDrop = true;
    },500);

    const r = fruits[nextFruit].r;

   items.push({
    x: Math.max(r, Math.min(mouseX, canvas.width-r)),
    y: 30,
    vx: 0,
    vy: 0,
    level: nextFruit
});

    nextFruit = Math.floor(Math.random() * 5);
});

function update(){

    if(gameOver) return;

    for(const item of items){

        item.vy += 0.25;

item.x += item.vx;
item.y += item.vy;

item.vx *= 0.98;

        const r = fruits[item.level].r;

        if(item.y > canvas.height - r){
            item.y = canvas.height - r;
            item.vy = 0;
        }

       if(item.x < r){
    item.x = r;
    item.vx *= -0.3;
}

if(item.x > canvas.width - r){
    item.x = canvas.width - r;
    item.vx *= -0.3;
}

    for(let i=0;i<items.length;i++){

        for(let j=i+1;j<items.length;j++){

            const a = items[i];
            const b = items[j];

            const ra = fruits[a.level].r;
            const rb = fruits[b.level].r;

            const dx = b.x - a.x;
            const dy = b.y - a.y;

            const dist = Math.sqrt(dx*dx + dy*dy);

            if(dist === 0) continue;

            const minDist = ra + rb;

            if(a.level === b.level && dist < minDist){
                else if(dist < minDist){

    const overlap = minDist - dist;

    const nx = dx / dist;
    const ny = dy / dist;

    a.x -= nx * overlap * 0.5;
    a.y -= ny * overlap * 0.5;

    b.x += nx * overlap * 0.5;
    b.y += ny * overlap * 0.5;

    a.vx -= nx * 0.25;
    b.vx += nx * 0.25;

    a.vy -= ny * 0.05;
    b.vy += ny * 0.05;
}

                if(a.level < fruits.length - 1){

                    a.level++;

                    a.x = (a.x + b.x) / 2;
                    a.y = (a.y + b.y) / 2;

                    score += Math.pow(2,a.level) * 20;

                    effectText = fruits[a.level].emoji;
                    effectTimer = 60;

                    if(a.level === fruits.length - 1){
                        score += 5000;
                        effectText = "🍉 COMPLETE!";
                        effectTimer = 180;
                    }
                }

                items.splice(j,1);
                j--;
            }
        }
    }

    // 積み上がった時のみゲームオーバー
    for(const item of items){

        const r = fruits[item.level].r;

        if(
            item.vy === 0 &&
            item.y > 180 &&
            item.y - r < gameOverLine
        ){
            gameOver = true;
        }
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    // SCORE
    ctx.fillStyle = "#222";
    ctx.font = "24px Arial";
    ctx.fillText("Score : " + score,20,40);

    // NEXT
    ctx.font = "22px Arial";
    ctx.fillText("NEXT",250,35);

    const next = fruits[nextFruit];

    ctx.beginPath();
    ctx.arc(
        340,
        60,
        20,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = next.color;
    ctx.fill();

    ctx.strokeStyle = "#333";
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "22px serif";

    ctx.fillText(next.emoji,340,60);

    // ライン
    ctx.beginPath();
    ctx.moveTo(0,gameOverLine);
    ctx.lineTo(canvas.width,gameOverLine);
    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;
    ctx.stroke();

    // 落下位置
    if(!gameOver){

        ctx.beginPath();
        ctx.arc(mouseX,80,10,0,Math.PI * 2);

        ctx.strokeStyle = "red";
        ctx.stroke();
    }

    // 果物描画
    for(const item of items){

        const fruit = fruits[item.level];

        ctx.beginPath();
        ctx.arc(
            item.x,
            item.y,
            fruit.r,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = fruit.color;
        ctx.fill();

        ctx.strokeStyle = "#333";
        ctx.stroke();

        ctx.font = `${Math.min(fruit.r,50)}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "#000";
        ctx.fillText(
            fruit.emoji,
            item.x,
            item.y
        );
    }

    // 演出
    if(gameOver){

        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "#fff";
        ctx.font = "48px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "GAME OVER",
            canvas.width/2,
            canvas.height/2
        );

        ctx.font = "24px Arial";

        ctx.fillText(
            "Score : " + score,
            canvas.width/2,
            canvas.height/2 + 60
        );
    }
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
